[project]
name = "openstage"
version = "0.1.0"
description = "Async Python library and dashboard for the Stages SB20 indoor bike"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "openstage contributors" }]
keywords = ["stages", "sb20", "ble", "bleak", "cycling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "bleak>=2.1",
  "rich>=13",
  "textual>=1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.scripts]
openstage-probe = "openstage.probe:main"
openstage-tui = "openstage.tui.app:main"
openstage-write = "openstage.write_cli:main"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "openstage" }]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["openstage"]
warn_unused_ignores = true

[tool.pyright]
include = ["openstage", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using default MTU value:UserWarning",
]
